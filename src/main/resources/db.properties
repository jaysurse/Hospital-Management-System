# =====================================================================
# Hospital Management System (HMS) - Database Configuration
# =====================================================================

# Primary Database: MySQL
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/hospital_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
db.user=root
db.password=root

# Connection Pool / Timeout Settings
db.connection.timeout=3000

# Standalone / Demonstration Fallback
# When enabled, if MySQL server is not detected on localhost, HMS will automatically
# initialize a zero-config in-memory database using the same schema & seed data,
# ensuring the viva presentation and desktop GUI work seamlessly without failure.
db.fallback.enabled=true
db.fallback.driver=org.h2.Driver
db.fallback.url=jdbc:h2:mem:hospital_management;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
db.fallback.user=sa
db.fallback.password=
